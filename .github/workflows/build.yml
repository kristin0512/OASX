name: Build OASX for Windows

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Verify required source files
        shell: pwsh
        run: |
          if (-not (Test-Path '.\pubspec.lock')) {
            throw 'pubspec.lock is missing. Do not delete it; the project build script requires it.'
          }
          if (-not (Test-Path '.\dev_tools\build_windows.ps1')) {
            throw 'dev_tools\build_windows.ps1 was not found.'
          }

      - name: Run Build Script
        shell: pwsh
        run: |
          & .\dev_tools\build_windows.ps1 -Flutter flutter
          if ($LASTEXITCODE -ne 0) { throw 'OASX Windows build failed.' }
          if (-not (Test-Path '.\dist\release\oasx.exe')) {
            throw 'Build completed but dist\release\oasx.exe was not found.'
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: OASX-Windows-Release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
